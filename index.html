<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ZENMARKET</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Geologica:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3f;
    --accent: #7c6ff7;
    --accent2: #ff6b6b;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --green: #4ade80;
    --nav-height: 60px;
  }
  body.theme-light {
    --bg: #f0f0f5;
    --surface: #ffffff;
    --surface2: #e8e8ee;
    --border: #d0d0dd;
    --accent: #6a5de8;
    --accent2: #e04040;
    --text: #1a1a2e;
    --muted: #6b6b80;
    --green: #2e7d32;
  }
  body.theme-neon {
    --bg: #0a0f0a;
    --surface: #0f1a0f;
    --surface2: #142014;
    --border: #2a4a2a;
    --accent: #00ff88;
    --accent2: #ff4466;
    --text: #e0ffe0;
    --muted: #609060;
    --green: #00ff88;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Geologica', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }
  body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events:none; z-index:1000; opacity:.5; }
  #authScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; position:relative; }
  .auth-glow { position:absolute; width:600px; height:600px; background: radial-gradient(circle, rgba(124,111,247,.15) 0%, transparent 70%); pointer-events:none; top:50%; left:50%; transform:translate(-50%,-50%); }
  .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius:20px; padding:48px 40px; width:420px; position:relative; animation: fadeUp .5s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .auth-logo { font-family:'Unbounded',sans-serif; font-size:28px; font-weight:900; letter-spacing:-1px; text-align:center; margin-bottom:8px; cursor:pointer; user-select:none; }
  .auth-logo span { color: var(--accent); }
  .auth-sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:32px; }
  .role-select { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
  .role-btn { padding:14px; border-radius:12px; border:2px solid var(--border); background:transparent; color:var(--muted); font-size:14px; cursor:pointer; transition:.2s; text-align:center; }
  .role-btn:hover { border-color: var(--accent); color:var(--text); }
  .role-btn.active { border-color: var(--accent); color:var(--text); background: rgba(124,111,247,.1); }
  .role-icon { font-size:22px; display:block; margin-bottom:4px; }
  .auth-tabs { display:flex; gap:0; background:var(--surface2); border-radius:10px; padding:4px; margin-bottom:24px; }
  .tab-btn { flex:1; padding:9px; border:none; background:transparent; color:var(--muted); font-size:13px; border-radius:7px; cursor:pointer; transition:.2s; }
  .tab-btn.active { background:var(--accent); color:#fff; }
  .inp-group { margin-bottom:14px; }
  .inp-group label { font-size:12px; color:var(--muted); display:block; margin-bottom:6px; letter-spacing:.5px; text-transform:uppercase; }
  .inp-group input { width:100%; padding:12px 14px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:14px; outline:none; transition:.2s; }
  .inp-group input:focus { border-color:var(--accent); }
  .btn-primary { width:100%; padding:14px; background: var(--accent); border:none; border-radius:12px; color:#fff; font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; cursor:pointer; transition:.2s; margin-top:4px; }
  .btn-primary:hover { background:#6a5de8; transform:translateY(-1px); }
  .btn-primary:active { transform:translateY(0); }
  .error-msg { color:var(--accent2); font-size:12px; text-align:center; margin-top:12px; min-height:18px; }
  #app { display:none; min-height:100vh; }
  .header { display:flex; align-items:center; justify-content:space-between; padding:16px 32px; border-bottom:1px solid var(--border); background:rgba(10,10,15,.8); backdrop-filter:blur(12px); position:sticky; top:0; z-index:100; }
  .header-logo { font-family:'Unbounded',sans-serif; font-size:18px; font-weight:900; }
  .header-logo span { color:var(--accent); }
  .header-user { display:flex; align-items:center; gap:12px; }
  .user-badge { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:6px 14px; font-size:13px; color:var(--muted); }
  .user-badge b { color:var(--text); }
  .btn-logout { padding:7px 16px; background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--muted); font-size:12px; cursor:pointer; transition:.2s; }
  .btn-logout:hover { border-color:var(--accent2); color:var(--accent2); }
  .nav-tabs { display:flex; gap:0; padding:0 32px; border-bottom:1px solid var(--border); background:var(--surface); }
  .nav-tab { padding:14px 24px; background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:.2s; }
  .nav-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .nav-tab:hover { color:var(--text); }
  .page { display:none; padding:40px 32px; max-width:1100px; margin:0 auto; }
  .page.active { display:block; animation: fadeUp .3s ease; }
  .page-title { font-family:'Unbounded',sans-serif; font-size:22px; font-weight:700; margin-bottom:28px; letter-spacing:-0.5px; }
  .page-title span { color:var(--accent); }
  .filters { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
  .filters select, .filters input { padding:10px 14px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; }
  .listings-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:20px; }
  .listing-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; transition:.25s; cursor:pointer; position:relative; }
  .listing-card:hover { border-color:var(--accent); transform:translateY(-3px); box-shadow:0 12px 40px rgba(124,111,247,.15); }
  .listing-img { width:100%; height:180px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:48px; object-fit:cover; }
  .listing-body { padding:18px; }
  .listing-tag { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; background:rgba(124,111,247,.15); color:var(--accent); margin-bottom:8px; }
  .listing-name { font-family:'Unbounded',sans-serif; font-size:16px; font-weight:700; margin-bottom:6px; }
  .listing-desc { font-size:13px; color:var(--muted); margin-bottom:14px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .listing-footer { display:flex; align-items:center; justify-content:space-between; }
  .listing-price { font-family:'Unbounded',sans-serif; font-size:18px; font-weight:700; color:var(--green); }
  .btn-buy { padding:8px 18px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-size:13px; font-weight:500; cursor:pointer; transition:.2s; }
  .btn-buy:hover { background:#6a5de8; }
  .orders-list { display:flex; flex-direction:column; gap:14px; }
  .order-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .order-num { font-family:'Unbounded',sans-serif; font-size:20px; color:var(--accent); font-weight:900; min-width:36px; text-align:center; }
  .order-info { flex:1; }
  .order-item { font-weight:500; font-size:15px; margin-bottom:4px; }
  .order-meta { font-size:12px; color:var(--muted); }
  .order-meta b { color:var(--text); }
  .order-comment { margin-top:6px; font-size:13px; color:var(--muted); font-style:italic; }
  .order-comment span { color:var(--text); }
  .order-price { font-family:'Unbounded',sans-serif; font-size:16px; color:var(--green); font-weight:700; white-space:nowrap; }
  .order-actions { display:flex; gap:8px; align-items:center; }
  .btn-chat, .btn-small, .btn-complete, .btn-delete { padding:8px 14px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-size:12px; cursor:pointer; font-family:'Geologica',sans-serif; transition:.2s; }
  .btn-complete { background: var(--green); }
  .btn-delete { background: var(--accent2); }
  .btn-chat:hover, .btn-small:hover { background:#6a5de8; }
  .btn-complete:hover { background: #3cb36b; }
  .btn-delete:hover { background: #e05555; }
  .empty-state { text-align:center; padding:60px; color:var(--muted); font-size:14px; }
  .empty-icon { font-size:48px; display:block; margin-bottom:12px; }
  .chat-area { border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--surface2); max-height:300px; overflow-y:auto; margin-bottom:12px; }
  .chat-msg { margin-bottom:10px; }
  .chat-msg .author { font-weight:700; font-size:12px; color:var(--accent); }
  .chat-msg .text { font-size:13px; color:var(--text); background:var(--surface); padding:8px 12px; border-radius:10px; display:inline-block; margin-top:2px; }
  .chat-input-row { display:flex; gap:8px; }
  .chat-input-row input { flex:1; padding:10px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); }
  .chat-input-row button { padding:10px 16px; background:var(--accent); border:none; border-radius:8px; color:#fff; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:500; display:none; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:36px; width:460px; animation: fadeUp .3s ease; position:relative; max-height:90vh; overflow-y:auto; }
  .modal-title { font-family:'Unbounded',sans-serif; font-size:17px; font-weight:700; margin-bottom:6px; }
  .modal-item-name { color:var(--accent); margin-bottom:20px; font-size:13px; }
  .modal-close { position:absolute; top:16px; right:16px; background:var(--surface2); border:none; border-radius:8px; width:32px; height:32px; color:var(--muted); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { color:var(--text); }
  .badge-admin { display:inline-block; padding:2px 8px; background:rgba(255,107,107,.15); color:var(--accent2); border-radius:6px; font-size:11px; margin-left:6px; vertical-align:middle; }
  .orders-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
  .orders-count { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:6px 14px; font-size:13px; color:var(--muted); }
  .orders-count b { color:var(--green); }
  .btn-refresh { padding:8px 16px; background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--muted); font-size:12px; cursor:pointer; transition:.2s; }
  .btn-refresh:hover { border-color:var(--accent); color:var(--accent); }
  .loading { text-align:center; padding:40px; color:var(--muted); font-size:14px; }
  .admin-panel { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:32px; }
  .admin-panel h3 { margin-bottom:16px; font-family:'Unbounded',sans-serif; }
  .form-row { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px; }
  .form-row input, .form-row select { padding:10px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); }
  .game-selector { display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:4px; }
  .game-selector input { border:none; background:transparent; color:var(--text); flex:1; padding:8px; }
  .game-selector button { padding:8px 12px; background:var(--accent); border:none; border-radius:6px; color:#fff; cursor:pointer; }
  .games-list { display:flex; flex-direction:column; gap:10px; }
  .games-list button { padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--surface2); color:var(--text); cursor:pointer; font-size:14px; text-align:left; transition:.2s; }
  .games-list button:hover { border-color:var(--accent); background:rgba(124,111,247,.1); }
  .promo-section { margin-top:24px; }
  .hidden { display:none !important; }
  body.device-mobile .header { padding:12px 16px; }
  body.device-mobile .header-user { gap:6px; }
  body.device-mobile .user-badge { display:none; }
  body.device-mobile .btn-logout { padding:6px 10px; font-size:10px; }
  body.device-mobile .nav-tabs { position:fixed; bottom:0; left:0; right:0; padding:0; border-bottom:none; border-top:1px solid var(--border); background:var(--surface); display:flex; justify-content:space-around; z-index:200; }
  body.device-mobile .nav-tab { padding:12px 8px; font-size:12px; flex:1; text-align:center; border-bottom:none; }
  body.device-mobile .page { padding:20px 16px 80px; }
  body.device-mobile .listings-grid { grid-template-columns: 1fr; gap:16px; }
  body.device-mobile .modal { width:100%; max-width:100%; border-radius:0; min-height:100vh; margin:0; }
  body.device-mobile .modal-close { top:10px; right:10px; width:36px; height:36px; }
  body.device-mobile .listing-img { height:200px; }
  body.device-mobile .filters { flex-direction:column; }
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-glow"></div>
  <div class="auth-card">
    <div class="auth-logo" id="authLogo">ZEN<span>MARKET</span></div>
    <div class="auth-sub">Торговая площадка</div>
    <div class="role-select">
      <button class="role-btn active" id="roleUser" onclick="selectRole('user')"><span class="role-icon">👤</span>Пользователь</button>
      <button class="role-btn" id="roleAdmin" onclick="selectRole('admin')" style="display:none"><span class="role-icon">🛡️</span>Администратор</button>
    </div>
    <div class="auth-tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Вход</button>
      <button class="tab-btn" id="tabReg" onclick="switchTab('reg')">Регистрация</button>
    </div>
    <div id="refInput" class="inp-group hidden">
      <label>Реферальный код</label>
      <input type="text" id="refCode" placeholder="Код приглашения">
    </div>
    <div class="inp-group">
      <label>Никнейм</label>
      <input type="text" id="authNick" placeholder="твой_ник">
    </div>
    <div class="inp-group">
      <label>Пароль</label>
      <input type="password" id="authPass" placeholder="••••••••" onkeydown="if(e.key==='Enter')doAuth()">
    </div>
    <div class="inp-group" style="display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="rememberMe" style="width:auto;"> 
      <label style="margin:0;text-transform:none;">Запомнить меня</label>
    </div>
    <button class="btn-primary" onclick="doAuth()">Войти</button>
    <div class="error-msg" id="authError"></div>
  </div>
</div>

<div id="app">
  <header class="header">
    <div class="header-logo">ZEN<span>MARKET</span></div>
    <div class="header-user">
      <div class="user-badge">Вы: <b id="dispNick">—</b><span id="adminBadge" class="badge-admin" style="display:none">ADMIN</span></div>
      <button class="btn-logout" onclick="logout()">Выйти</button>
      <button class="btn-small" onclick="showPage('settings')" title="Настройки">⚙️</button>
      <button class="btn-small" id="themeBtn" onclick="switchTheme()" title="Сменить тему">🎨</button>
    </div>
  </header>
  <nav class="nav-tabs" id="navTabs">
    <button class="nav-tab active" onclick="showPage('shop')">🛒 Объявления</button>
    <button class="nav-tab" id="ordersTab" style="display:none" onclick="showPage('orders')">📋 Заказы</button>
    <button class="nav-tab" id="myOrdersTab" style="display:none" onclick="showPage('myorders')">📦 Мои заказы</button>
    <button class="nav-tab" id="adminTab" style="display:none" onclick="showPage('admin')">⚙️ Управление</button>
  </nav>

  <div class="page active" id="pageShop">
    <div class="page-title"><span>Актуальные</span> объявления</div>
    <div class="filters">
      <select id="categoryFilter" onchange="renderListings()">
        <option value="all">Все категории</option>
        <option value="Brawl Stars">Brawl Stars</option>
        <option value="Valorant">Valorant</option>
        <option value="Car Parking">Car Parking</option>
        <option value="Другое">Другое</option>
      </select>
      <input type="text" id="searchInput" placeholder="Поиск..." oninput="renderListings()">
    </div>
    <div class="listings-grid" id="listingsGrid"></div>
  </div>

  <div class="page" id="pageOrders">
    <div class="orders-header">
      <div class="page-title" style="margin:0"><span>Заказы</span></div>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="orders-count">Активных: <b id="ordersCountBadge">0</b></div>
        <button class="btn-refresh" onclick="loadOrders()">↻ Обновить</button>
      </div>
    </div>
    <div id="ordersList" class="orders-list"><div class="loading">Загрузка...</div></div>
  </div>

  <div class="page" id="pageMyorders">
    <div class="page-title"><span>Мои</span> заказы</div>
    <div id="myOrdersList" class="orders-list"><div class="loading">Загрузка...</div></div>
  </div>

  <div class="page" id="pageAdmin">
    <div class="admin-panel">
      <h3>📦 Управление товарами</h3>
      <div class="form-row">
        <input type="text" id="newName" placeholder="Название">
        <input type="text" id="newPrice" placeholder="Цена (напр. 1350 ₽)">
        <input type="text" id="newEmoji" placeholder="Эмодзи (если нет фото)">
        <div class="game-selector">
          <input type="text" id="newCategory" placeholder="Игра" readonly>
          <button type="button" onclick="openGamePicker()">🎮</button>
        </div>
        <input type="text" id="newImageUrl" placeholder="URL изображения">
        <input type="text" id="newDesc" placeholder="Описание">
        <input type="file" id="imageUpload" accept="image/*" style="display:none" onchange="uploadImage(this)">
        <button class="btn-small" onclick="document.getElementById('imageUpload').click()">🖼️ Загрузить фото</button>
      </div>
      <button class="btn-small" onclick="addListing()">➕ Добавить товар</button>
      <hr style="margin:20px 0;border-color:var(--border)">
      <div id="adminListings" class="orders-list" style="margin-top:16px;"></div>
    </div>

    <div class="admin-panel promo-section" id="promoPanel">
      <h3>🎟️ Промокоды</h3>
      <div class="form-row">
        <input type="text" id="promoCode" placeholder="Код (напр. SALE20)">
        <input type="number" id="promoDiscount" placeholder="Скидка % (0-100)">
        <select id="promoType">
          <option value="discount">Скидка</option>
          <option value="theme">Разблокировать тему</option>
        </select>
      </div>
      <button class="btn-small" onclick="createPromo()">➕ Создать промокод</button>
      <div id="promoList" style="margin-top:16px;"></div>
    </div>

    <div class="admin-panel" id="invitePanel">
      <h3>🔗 Приглашения для админов</h3>
      <div class="form-row">
        <input type="text" id="inviteCode" placeholder="Сгенерированный код" readonly>
        <input type="number" id="inviteUses" placeholder="Кол-во использований (0=беск.)" min="0" value="1">
        <button class="btn-small" onclick="generateInvite()">Создать код</button>
      </div>
      <div id="inviteList" style="margin-top:16px;"></div>
    </div>

    <!-- НОВЫЙ БЛОК: список админов для GENERAL_ADMIN -->
    <div class="admin-panel" id="adminListPanel">
      <h3>👥 Администраторы</h3>
      <div id="adminListContent" style="margin-top:12px;"></div>
    </div>
  </div>

  <div class="page" id="pageSettings">
    <div class="page-title"><span>Настройки</span></div>
    <div class="auth-card" style="width:400px;margin:0 auto;">
      <h3 style="font-family:'Unbounded';margin-bottom:16px">Сменить пароль</h3>
      <div class="inp-group">
        <label>Старый пароль</label>
        <input type="password" id="oldPass" placeholder="••••••••">
      </div>
      <div class="inp-group">
        <label>Новый пароль</label>
        <input type="password" id="newPass" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="changePassword()">Сменить</button>
      <div class="error-msg" id="settingsError"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="listingModal">
  <div class="modal">
    <button class="modal-close" onclick="closeListingModal()">✕</button>
    <div class="listing-img" style="height:250px; background:var(--surface2); display:flex; align-items:center; justify-content:center;" id="modalListingImg"></div>

<script>
(function(){
  var _0xa = ['JDJhJDEw', 'JDB6MzNY', 'Fdq7d10TIBLqWAttubIsCdbksLxuOcqV.PfM4KVHyVoTqFQ6'];
  var _0xb = ['NmEwYjgxOGY2NjEwZGQzYWU4NjgzMjZh'];
  var _0xc = ['emVuaW4='];
  window.ZK = (function(p){ return atob(p[0]) + atob(p[1]) + p[2]; })(_0xa);
  window.ZB = atob(_0xb[0]);
  window.ZAPI = 'https://api.jsonbin.io/v3/b/' + window.ZB;
  window.ADMIN_PASS = atob(_0xc[0]);
  window.IMGBB_KEY = '192fac5fc9c09cc3d8194e80f1d85830';
})();

const JSONBIN_KEY = window.ZK;
const API = window.ZAPI;
const ADMIN_PASS = window.ADMIN_PASS;
const IMGBB_KEY = window.IMGBB_KEY;

let currentUser = null;
let currentListing = null;
let listings = [], promoCodes = [], orders = [], admins = [], invites = [];
let activeRole = 'user', activeTab = 'login', currentChatOrderId = null;
let availableThemes = ['dark'];
let logoClickCount = 0, logoClickTimer = null;
let currentDevice = 'desktop';

async function fetchData() {
  try {
    const res = await fetch(API + '/latest', { headers: { 'X-Access-Key': JSONBIN_KEY } });
    const data = await res.json();
    const rec = data.record;
    orders = rec.orders || [];
    listings = rec.listings || [];
    promoCodes = rec.promocodes || [];
    admins = rec.admins || [];
    invites = rec.invites || [];
    if (!Array.isArray(admins)) admins = [];
    if (!Array.isArray(invites)) invites = [];
  } catch(e) { console.error('Fetch error', e); }
}

async function saveRecord() {
  await fetch(API, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Access-Key': JSONBIN_KEY },
    body: JSON.stringify({ orders, listings, promoCodes, admins, invites })
  });
}

function isAdminUser() { return currentUser && admins.some(a => a.nick === currentUser.nick); }
function isGeneralAdmin() { return currentUser && currentUser.nick === 'GENERAL_ADMIN'; }

function updateAdminVisibility() {
  const promoPanel = document.getElementById('promoPanel');
  const invitePanel = document.getElementById('invitePanel');
  const adminListPanel = document.getElementById('adminListPanel');
  if (isGeneralAdmin()) {
    promoPanel.classList.remove('hidden');
    invitePanel.classList.remove('hidden');
    adminListPanel.classList.remove('hidden');
  } else if (isAdminUser()) {
    const adminEntry = admins.find(a => a.nick === currentUser.nick);
    if (adminEntry) {
      promoPanel.classList.toggle('hidden', !adminEntry.canCreatePromo);
      invitePanel.classList.toggle('hidden', !adminEntry.canInvite);
    }
    adminListPanel.classList.add('hidden');
  } else {
    promoPanel.classList.add('hidden');
    invitePanel.classList.add('hidden');
    adminListPanel.classList.add('hidden');
  }
}

function autoLogin() {
  const saved = localStorage.getItem('zm_autologin');
  if (saved) {
    const { nick, role } = JSON.parse(saved);
    currentUser = { nick, role };
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('dispNick').textContent = nick;
    if (role === 'admin' || isAdminUser()) {
      document.getElementById('adminBadge').style.display = 'inline';
      document.getElementById('ordersTab').style.display = 'inline-block';
      document.getElementById('adminTab').style.display = 'inline-block';
      currentUser.role = 'admin';
    }
    if (role === 'user') {
      document.getElementById('myOrdersTab').style.display = 'inline-block';
    }
    fetchData().then(() => {
      renderListings();
      if (isAdminUser()) renderAdminListings();
      updateAdminVisibility();
      checkDeviceSelection();
    });
  }
}

document.getElementById('authLogo').addEventListener('click', function() {
  logoClickCount++;
  clearTimeout(logoClickTimer);
  logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 2000);
  if (logoClickCount >= 10) {
    document.getElementById('roleAdmin').style.display = '';
    logoClickCount = 0;
  }
});

function selectRole(r) {
  activeRole = r;
  document.getElementById('roleUser').classList.toggle('active', r==='user');
  document.getElementById('roleAdmin').classList.toggle('active', r==='admin');
  document.getElementById('tabReg').style.display = '';
  document.getElementById('refInput').classList.add('hidden');
  if (r === 'admin') {
    document.getElementById('tabReg').style.display = '';
    document.getElementById('refInput').classList.remove('hidden');
    switchTab('reg');
  }
}

function switchTab(t) {
  activeTab = t;
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabReg').classList.toggle('active', t==='reg');
  document.getElementById('authError').textContent = '';
}

async function doAuth() {
  const nick = document.getElementById('authNick').value.trim();
  const pass = document.getElementById('authPass').value;
  const remember = document.getElementById('rememberMe').checked;
  const refCode = document.getElementById('refCode')?.value.trim();
  const err = document.getElementById('authError');
  err.textContent = '';

  if (!nick || !pass) { err.textContent = 'Заполни все поля'; return; }

  if (activeRole === 'admin') {
    await fetchData();
    if (activeTab === 'reg') {
      const invite = invites.find(i => i.code === refCode);
      if (!invite) { err.textContent = 'Неверный реф. код'; return; }
      if (invite.maxUses > 0 && invite.used >= invite.maxUses) { err.textContent = 'Код больше не действителен'; return; }
      invite.used++;
      admins.push({ nick, pass, canCreatePromo: false, canInvite: false });
      await saveRecord();
      login(nick, pass, 'admin', remember);
    } else {
      const admin = admins.find(a => a.nick === nick && a.pass === pass);
      if (!admin && nick !== 'GENERAL_ADMIN') { err.textContent = 'Неверный логин или пароль'; return; }
      if (nick === 'GENERAL_ADMIN' && pass !== ADMIN_PASS) { err.textContent = 'Неверный пароль'; return; }
      if (nick === 'GENERAL_ADMIN' && !admins.some(a => a.nick === 'GENERAL_ADMIN')) {
        admins.push({ nick: 'GENERAL_ADMIN', pass: ADMIN_PASS, canCreatePromo: true, canInvite: true });
        await saveRecord();
      }
      login(nick, pass, 'admin', remember);
    }
    return;
  }

  const users = getUsers();
  if (activeTab === 'reg') {
    if (users[nick]) { err.textContent = 'Ник уже занят'; return; }
    users[nick] = pass;
    saveUsers(users);
    login(nick, pass, 'user', remember);
  } else {
    if (!users[nick]) { err.textContent = 'Пользователь не найден'; return; }
    if (users[nick] !== pass) { err.textContent = 'Неверный пароль'; return; }
    login(nick, pass, 'user', remember);
  }
}

function login(nick, pass, role, remember) {
  currentUser = { nick, pass, role };
  if (remember) localStorage.setItem('zm_autologin', JSON.stringify({ nick, role }));
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('dispNick').textContent = nick;
  document.getElementById('adminBadge').style.display = (role === 'admin' || isAdminUser()) ? 'inline' : 'none';
  document.getElementById('ordersTab').style.display = (role === 'admin' || isAdminUser()) ? 'inline-block' : 'none';
  document.getElementById('adminTab').style.display = (role === 'admin' || isAdminUser()) ? 'inline-block' : 'none';
  document.getElementById('myOrdersTab').style.display = role === 'user' ? 'inline-block' : 'none';
  fetchData().then(() => {
    renderListings();
    if (isAdminUser()) renderAdminListings();
    updateAdminVisibility();
    checkDeviceSelection();
  });
}

function logout() {
  currentUser = null;
  localStorage.removeItem('zm_autologin');
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  ['adminBadge','ordersTab','adminTab','myOrdersTab'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  document.getElementById('authError').textContent = '';
  document.body.classList.remove('device-mobile');
  showPage('shop');
}

function showPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  const pageId = p === 'myorders' ? 'pageMyorders' : 'page' + p.charAt(0).toUpperCase() + p.slice(1);
  document.getElementById(pageId).classList.add('active');
  document.querySelector(`.nav-tab[onclick="showPage('${p}')"]`).classList.add('active');
  if (p === 'orders') loadOrders();
  if (p === 'myorders') loadMyOrders();
  if (p === 'admin') { renderAdminListings(); renderPromoList(); renderInviteList(); renderAdminList(); updateAdminVisibility(); }
}

function renderListings() {
  const cat = document.getElementById('categoryFilter')?.value || 'all';
  const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
  let filtered = listings;
  if (cat !== 'all') filtered = filtered.filter(l => l.category === cat);
  if (search) filtered = filtered.filter(l => l.name.toLowerCase().includes(search) || l.desc.toLowerCase().includes(search));
  const grid = document.getElementById('listingsGrid');
  grid.innerHTML = filtered.map(l => `
    <div class="listing-card" onclick="openListingDetails('${l.id}')">
      <div class="listing-img" style="display:flex;align-items:center;justify-content:center;overflow:hidden;">
        ${l.imageUrl ? `<img src="${l.imageUrl}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentNode.innerHTML='${l.emoji}'">` : l.emoji}
      </div>
      <div class="listing-body">
        <div class="listing-tag">${l.category}</div>
        <div class="listing-name">${l.name}</div>
        <div class="listing-desc">${l.desc}</div>
        <div class="listing-footer">
          <div class="listing-price">${l.price}</div>
          <button class="btn-buy" onclick="event.stopPropagation(); openBuy('${l.id}')">Купить</button>
        </div>
      </div>
    </div>
  `).join('');
}

function openListingDetails(id) {
  const l = listings.find(i => i.id === id);
  if (!l) return;
  document.getElementById('modalListingImg').innerHTML = l.imageUrl 
    ? `<img src="${l.imageUrl}" style="width:100%;height:100%;object-fit:cover;">` 
    : l.emoji;
  document.getElementById('modalListingName').textContent = l.name;
  document.getElementById('modalListingCat').textContent = l.category;
  document.getElementById('modalListingDesc').textContent = l.desc;
  document.getElementById('modalListingPrice').textContent = l.price;
  currentListing = l;
  document.getElementById('listingModal').classList.add('open');
}
function closeListingModal() { document.getElementById('listingModal').classList.remove('open'); }

function openBuyFromModal() {
  closeListingModal();
  openBuy(currentListing.id);
}

function openBuy(id) {
  currentListing = listings.find(l => l.id === id);
  document.getElementById('modalItemName').textContent = `${currentListing.emoji} ${currentListing.name}`;
  document.getElementById('finalPrice').textContent = `Цена: ${currentListing.price}`;
  document.getElementById('buyPass').value = '';
  document.getElementById('promoInput').value = '';
  document.getElementById('buyComment').value = '';
  document.getElementById('buyError').textContent = '';
  document.getElementById('buyModal').classList.add('open');
}
function closeModal() { document.getElementById('buyModal').classList.remove('open'); }

async function submitOrder() {
  const pass = document.getElementById('buyPass').value;
  const comment = document.getElementById('buyComment').value.trim();
  const promoInput = document.getElementById('promoInput').value.trim();
  const err = document.getElementById('buyError');
  err.textContent = '';

  if (currentUser.role === 'user') {
    const users = getUsers();
    if (users[currentUser.nick] !== pass) { err.textContent = 'Неверный пароль'; return; }
  } else {
    if (pass !== ADMIN_PASS && !admins.some(a => a.nick === currentUser.nick && a.pass === pass)) {
      err.textContent = 'Неверный пароль'; return;
    }
  }

  const btn = document.getElementById('buySubmitBtn');
  btn.textContent = 'Отправка...'; btn.disabled = true;

  try {
    const getRes = await fetch(API + '/latest', { headers: { 'X-Access-Key': JSONBIN_KEY } });
    if (!getRes.ok) throw new Error(`Ошибка ${getRes.status}`);
    const getData = await getRes.json();
    orders = getData.record.orders || [];
    promoCodes = getData.record.promocodes || [];
    listings = getData.record.listings || [];
    admins = getData.record.admins || [];
    invites = getData.record.invites || [];

    let discount = 0;
    if (promoInput) {
      const promo = promoCodes.find(p => p.code === promoInput);
      if (promo) {
        if (promo.type === 'discount') {
          discount = promo.discount;
          err.textContent = `Применена скидка ${discount}%`;
        } else if (promo.type === 'theme') {
          if (!availableThemes.includes('light')) availableThemes.push('light');
          if (!availableThemes.includes('neon')) availableThemes.push('neon');
          localStorage.setItem('zm_themes', JSON.stringify(availableThemes));
          err.textContent = 'Тема разблокирована!';
        }
      } else {
        err.textContent = 'Неверный промокод';
        btn.textContent = 'Оформить заказ'; btn.disabled = false;
        return;
      }
    }

    const newOrder = {
      id: Date.now(),
      user: currentUser.nick,
      item: currentListing.name,
      price: currentListing.price,
      comment: comment || '—',
      date: new Date().toLocaleString('ru'),
      chat: [],
      status: 'active'
    };
    orders.push(newOrder);
    await fetch(API, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Access-Key': JSONBIN_KEY },
      body: JSON.stringify({ orders, listings, promoCodes, admins, invites })
    });

    addMyOrderId(newOrder.id);
    closeModal();
    openChatForOrder(newOrder.id);
  } catch(e) {
    console.error(e);
    err.textContent = 'Ошибка: ' + (e.message || 'Сеть недоступна');
  } finally {
    btn.textContent = 'Оформить заказ'; btn.disabled = false;
  }
}

function getMyOrderIds() {
  const raw = localStorage.getItem('zm_myorders_' + (currentUser?.nick || ''));
  return raw ? JSON.parse(raw) : [];
}
function addMyOrderId(orderId) {
  const ids = getMyOrderIds();
  if (!ids.includes(orderId)) {
    ids.push(orderId);
    localStorage.setItem('zm_myorders_' + currentUser.nick, JSON.stringify(ids));
  }
}

async function loadMyOrders() {
  const list = document.getElementById('myOrdersList');
  list.innerHTML = '<div class="loading">Загрузка...</div>';
  const ids = getMyOrderIds();
  if (ids.length === 0) {
    list.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span>У вас пока нет заказов</div>';
    return;
  }
  try {
    const res = await fetch(API + '/latest', { headers: { 'X-Access-Key': JSONBIN_KEY } });
    if (!res.ok) throw new Error(`Ошибка ${res.status}`);
    const data = await res.json();
    const allOrders = data.record.orders || [];
    const myOrders = allOrders.filter(o => ids.includes(o.id)).reverse();
    if (myOrders.length === 0) {
      list.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span>Заказы не найдены</div>';
      return;
    }
    list.innerHTML = myOrders.map(o => `
      <div class="order-card">
        <div class="order-num">#${o.id.toString().slice(-4)}</div>
        <div class="order-info">
          <div class="order-item">${o.item}</div>
          <div class="order-meta">🕐 ${o.date}</div>
          <div class="order-comment">💬 <span>${o.comment}</span></div>
          <div class="order-meta">📌 <b>${o.status === 'completed' ? 'Завершён' : 'В обработке'}</b></div>
        </div>
        <div class="order-price">${o.price}</div>
        <button class="btn-chat" onclick="openChatForOrder(${o.id})">💬 Чат</button>
      </div>
    `).join('');
  } catch(e) {
    list.innerHTML = `<div class="empty-state"><span class="empty-icon">❌</span>Ошибка: ${e.message}</div>`;
  }
}

async function loadOrders() {
  const list = document.getElementById('ordersList');
  list.innerHTML = '<div class="loading">Загрузка заказов...</div>';
  try {
    const res = await fetch(API + '/latest', { headers: { 'X-Access-Key': JSONBIN_KEY } });
    if (!res.ok) throw new Error(`Ошибка ${res.status}`);
    const data = await res.json();
    orders = data.record.orders || [];
    const activeOrders = orders.filter(o => o.status !== 'completed');
    const completedOrders = orders.filter(o => o.status === 'completed');
    document.getElementById('ordersCountBadge').textContent = activeOrders.length;

    let html = '';
    if (activeOrders.length === 0) {
      html += '<div class="empty-state"><span class="empty-icon">📭</span>Нет активных заказов</div>';
    } else {
      html += '<h3 style="margin-bottom:12px;">⚡ Активные</h3>';
      html += activeOrders.slice().reverse().map(o => `
        <div class="order-card">
          <div class="order-num">#${o.id.toString().slice(-4)}</div>
          <div class="order-info">
            <div class="order-item">${o.item}</div>
            <div class="order-meta">👤 <b>${o.user}</b> · 🕐 ${o.date}</div>
            <div class="order-comment">💬 <span>${o.comment}</span></div>
          </div>
          <div class="order-price">${o.price}</div>
          <div class="order-actions">
            <button class="btn-chat" onclick="openChatForOrder(${o.id})">💬 Чат (${o.chat ? o.chat.length : 0})</button>
            <button class="btn-complete" onclick="completeOrder(${o.id})">✅ Завершить</button>
            <button class="btn-delete" onclick="deleteOrder(${o.id})">🗑️ Удалить</button>
          </div>
        </div>
      `).join('');
    }

    if (completedOrders.length > 0) {
      html += '<h3 style="margin:24px 0 12px;">✅ Завершённые</h3>';
      html += completedOrders.slice().reverse().map(o => `
        <div class="order-card" style="opacity:0.7;">
          <div class="order-num">#${o.id.toString().slice(-4)}</div>
          <div class="order-info">
            <div class="order-item">${o.item}</div>
            <div class="order-meta">👤 <b>${o.user}</b> · 🕐 ${o.date}</div>
            <div class="order-comment">💬 <span>${o.comment}</span></div>
          </div>
          <div class="order-price">${o.price}</div>
          <div class="order-actions">
            <span style="color:var(--green);font-size:12px;">✔ Завершён</span>
            <button class="btn-delete" onclick="deleteOrder(${o.id})">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    list.innerHTML = html || '<div class="empty-state"><span class="empty-icon">📭</span>Заказов пока нет</div>';
  } catch(e) {
    list.innerHTML = `<div class="empty-state"><span class="empty-icon">❌</span>Ошибка: ${e.message}</div>`;
  }
}

async function completeOrder(orderId) {
  const order = orders.find(o => o.id === orderId);
  if (order) {
    order.status = 'completed';
    await saveRecord();
    loadOrders();
  }
}

async function deleteOrder(orderId) {
  orders = orders.filter(o => o.id !== orderId);
  await saveRecord();
  loadOrders();
}

async function addListing() {
  const name = document.getElementById('newName').value.trim();
  const price = document.getElementById('newPrice').value.trim();
  const emoji = document.getElementById('newEmoji').value.trim();
  const category = document.getElementById('newCategory').value.trim();
  const imageUrl = document.getElementById('newImageUrl').value.trim();
  const desc = document.getElementById('newDesc').value.trim();
  if (!name || !price || !category) return;
  const newListing = {
    id: Date.now().toString(),
    name, price, emoji: emoji || '📦', category, imageUrl, desc
  };
  listings.push(newListing);
  await saveRecord();
  renderListings();
  renderAdminListings();
}

async function deleteListing(id) {
  listings = listings.filter(l => l.id !== id);
  await saveRecord();
  renderListings();
  renderAdminListings();
}

function renderAdminListings() {
  const container = document.getElementById('adminListings');
  if (!container) return;
  container.innerHTML = listings.map(l => `
    <div class="order-card">
      <span>${l.emoji} ${l.name} — ${l.price} (${l.category})</span>
      <button class="btn-delete" onclick="deleteListing('${l.id}')">🗑️</button>
    </div>
  `).join('');
}

async function createPromo() {
  const code = document.getElementById('promoCode').value.trim();
  const discount = parseInt(document.getElementById('promoDiscount').value) || 0;
  const type = document.getElementById('promoType').value;
  if (!code) return;
  promoCodes.push({ code, discount: type === 'discount' ? discount : 0, type });
  await saveRecord();
  renderPromoList();
}

async function deletePromo(code) {
  promoCodes = promoCodes.filter(p => p.code !== code);
  await saveRecord();
  renderPromoList();
}

function renderPromoList() {
  const container = document.getElementById('promoList');
  if (!container) return;
  container.innerHTML = promoCodes.map(p => `
    <div style="margin-bottom:6px;">${p.code} — ${p.type === 'discount' ? p.discount + '%' : 'Тема'} 
    <button class="btn-delete" onclick="deletePromo('${p.code}')">🗑️</button></div>
  `).join('');
}

function generateInvite() {
  if (!isAdminUser() || !(isGeneralAdmin() || admins.find(a=>a.nick===currentUser.nick)?.canInvite)) return;
  const code = Math.random().toString(36).substring(2,8).toUpperCase();
  const uses = parseInt(document.getElementById('inviteUses').value);
  const maxUses = (uses || uses === 0) ? uses : 1;
  invites.push({ code, maxUses, used: 0, createdBy: currentUser.nick });
  saveRecord();
  renderInviteList();
  document.getElementById('inviteCode').value = code;
}

function renderInviteList() {
  const container = document.getElementById('inviteList');
  container.innerHTML = invites.map(i => {
    const usesText = i.maxUses === 0 ? '∞' : i.maxUses;
    return `<div>${i.code} (исп: ${i.used}/${usesText}) 
    <button class="btn-delete" onclick="deleteInvite('${i.code}')">🗑️</button></div>`;
  }).join('');
}

function deleteInvite(code) {
  invites = invites.filter(i => i.code !== code);
  saveRecord();
  renderInviteList();
}

// Функция для отображения и удаления администраторов
function renderAdminList() {
  const container = document.getElementById('adminListContent');
  if (!container) return;
  const generalAdmin = admins.find(a => a.nick === 'GENERAL_ADMIN');
  const otherAdmins = admins.filter(a => a.nick !== 'GENERAL_ADMIN');
  let html = '<div style="margin-bottom:8px; font-weight:bold;">GENERAL_ADMIN (неудаляемый)</div>';
  otherAdmins.forEach(a => {
    html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
      <span>${a.nick}</span>
      <button class="btn-delete" onclick="deleteAdmin('${a.nick}')">🗑️</button>
    </div>`;
  });
  container.innerHTML = html || 'Нет других администраторов';
}

async function deleteAdmin(nick) {
  if (nick === 'GENERAL_ADMIN') return;
  if (!isGeneralAdmin()) return;
  admins = admins.filter(a => a.nick !== nick);
  await saveRecord();
  renderAdminList();
}

function changePassword() {
  const old = document.getElementById('oldPass').value;
  const newP = document.getElementById('newPass').value;
  const err = document.getElementById('settingsError');
  err.textContent = '';
  if (!old || !newP) { err.textContent = 'Заполните поля'; return; }
  if (currentUser.role === 'admin' || isAdminUser()) {
    const admin = admins.find(a => a.nick === currentUser.nick);
    if (!admin || admin.pass !== old) { err.textContent = 'Неверный старый пароль'; return; }
    admin.pass = newP;
    saveRecord();
  } else {
    const users = getUsers();
    if (!users[currentUser.nick] || users[currentUser.nick] !== old) { err.textContent = 'Неверный старый пароль'; return; }
    users[currentUser.nick] = newP;
    saveUsers(users);
  }
  currentUser.pass = newP;
  alert('Пароль изменён!');
}

function uploadImage(input) {
  if (!IMGBB_KEY || IMGBB_KEY.startsWith('вставь')) {
    alert('Необходимо указать API ключ imgbb в коде');
    return;
  }
  const file = input.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('image', file);
  fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
    method: 'POST',
    body: formData
  })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      document.getElementById('newImageUrl').value = data.data.url;
    } else {
      alert('Ошибка загрузки');
    }
  })
  .catch(() => alert('Ошибка сети'));
}

function openChatForOrder(orderId) {
  currentChatOrderId = orderId;
  document.getElementById('chatOrderId').textContent = '#' + orderId.toString().slice(-4);
  document.getElementById('chatMessages').innerHTML = 'Загрузка...';
  document.getElementById('chatInput').value = '';
  document.getElementById('chatError').textContent = '';
  document.getElementById('chatModal').classList.add('open');
  refreshChat();
}
function closeChatModal() { document.getElementById('chatModal').classList.remove('open'); }

async function refreshChat() {
  const orderId = currentChatOrderId;
  const chatDiv = document.getElementById('chatMessages');
  try {
    const res = await fetch(API + '/latest', { headers: { 'X-Access-Key': JSONBIN_KEY } });
    if (!res.ok) throw new Error(`Ошибка ${res.status}`);
    const data = await res.json();
    const allOrders = data.record.orders || [];
    const order = allOrders.find(o => o.id === orderId);
    if (!order) { chatDiv.innerHTML = 'Заказ не найден'; return; }
    const messages = order.chat || [];
    if (messages.length === 0) {
      chatDiv.innerHTML = '<div style="color:var(--muted)">Пока нет сообщений. Напишите первым.</div>';
      return;
    }
    chatDiv.innerHTML = messages.map(m => `
      <div class="chat-msg">
        <div class="author">${m.author} (${m.role})</div>
        <div class="text">${m.text}</div>
        <div style="font-size:10px;color:var(--muted)">${m.time}</div>
      </div>
    `).join('');
    chatDiv.scrollTop = chatDiv.scrollHeight;
  } catch(e) {
    chatDiv.innerHTML = `Ошибка загрузки чата: ${e.message}`;
  }
}

async function sendChatMessage() {
  const text = document.getElementById('chatInput').value.trim();
  const err = document.getElementById('chatError');
  err.textContent = '';
  if (!text) return;
  if (!currentUser) return;

  try {
    const res = await fetch(API + '/latest', { headers: { 'X-Access-Key': JSONBIN_KEY } });
    if (!res.ok) throw new Error(`Ошибка ${res.status}`);
    const data = await res.json();
    let allOrders = data.record.orders || [];
    const idx = allOrders.findIndex(o => o.id === currentChatOrderId);
    if (idx === -1) { err.textContent = 'Заказ не найден'; return; }
    if (!allOrders[idx].chat) allOrders[idx].chat = [];
    allOrders[idx].chat.push({
      author: currentUser.nick,
      role: currentUser.role,
      text: text,
      time: new Date().toLocaleString('ru')
    });

    await fetch(API, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Access-Key': JSONBIN_KEY },
      body: JSON.stringify({ orders: allOrders, listings, promoCodes, admins, invites })
    });
    document.getElementById('chatInput').value = '';
    await refreshChat();
  } catch(e) {
    err.textContent = 'Ошибка отправки: ' + e.message;
  }
}

function switchTheme() {
  const body = document.body;
  if (body.classList.contains('theme-light')) {
    body.classList.remove('theme-light');
    body.classList.add('theme-neon');
  } else if (body.classList.contains('theme-neon')) {
    body.classList.remove('theme-neon');
  } else {
    body.classList.add('theme-light');
  }
  localStorage.setItem('zm_theme', body.classList.toString());
}

function openGamePicker() { document.getElementById('gamePickerModal').classList.add('open'); }
function closeGamePicker() { document.getElementById('gamePickerModal').classList.remove('open'); }
function selectGame(game) { document.getElementById('newCategory').value = game; closeGamePicker(); }

function getUsers() { return JSON.parse(localStorage.getItem('zm_users') || '{}'); }
function saveUsers(u) { localStorage.setItem('zm_users', JSON.stringify(u)); }

function setDevice(type) {
  currentDevice = type;
  if (type === 'mobile') {
    document.body.classList.add('device-mobile');
  } else {
    document.body.classList.remove('device-mobile');
  }
  if (currentUser) {
    localStorage.setItem('zm_device_' + currentUser.nick, type);
  }
  document.getElementById('deviceModal').classList.remove('open');
}

function checkDeviceSelection() {
  if (!currentUser) return;
  const saved = localStorage.getItem('zm_device_' + currentUser.nick);
  if (saved) {
    currentDevice = saved;
    if (saved === 'mobile') document.body.classList.add('device-mobile');
    else document.body.classList.remove('device-mobile');
  } else {
    document.getElementById('deviceModal').classList.add('open');
  }
}

document.getElementById('chatModal').addEventListener('click', function(e) { if (e.target === this) closeChatModal(); });
